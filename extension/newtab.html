<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daytown · your workbench</title><link rel="stylesheet" href="style.css"></head>
<body class="newtab" data-mode="newtab"><main class="newtab-shell"><section class="newtab-town" aria-label="Your workbench"><div id="town-scene" class="town-scene"><img id="town-image" alt="Your tasks beside a pixel-art workbench" hidden><div class="town-placeholder" id="town-placeholder"><div class="placeholder-hills"></div><div class="placeholder-road"></div><span class="house h1">&gt;_</span><span class="house h2">&gt;_</span><span class="house h3">&gt;_</span><span class="tree t1">♠</span><span class="tree t2">♠</span><p>Start Daytown to load your workbench.</p></div><div id="town-light" class="town-light"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div id="rain" aria-hidden="true"></div><div id="plot-buttons" class="plot-buttons"></div><div id="fireworks" aria-hidden="true"></div><div class="view-badge" id="view-badge">At your desk</div></div></section>
<header class="newtab-top"><a class="brand" href="http://localhost:3000/" title="Open Daytown dashboard"><span class="brand-mark">d<span>✦</span></span>daytown</a><div class="top-actions"><span id="connection" class="connection">Connecting…</span><button id="float-pet" class="button">Pin workbench</button><a class="button" href="http://localhost:3000/">Open Daytown ↗</a></div></header>
<section class="newtab-copy"><span class="eyebrow" id="day-label">Your workbench</span><h1 id="greeting">Your next step is ready.</h1></section>
<section class="newtab-bottom"><div class="next-copy"><span class="eyebrow">Next step</span><h2 id="next-title">What needs doing?</h2><p id="tiny-step">Add a task by voice or text.</p><div class="focus-timer" id="focus-timer" hidden></div></div><div class="next-actions"><button id="doing" class="button dark">Doing it ↗</button><button id="done" class="button pale">✓ Done</button><a class="text-link" href="https://www.google.com/" title="Continue to Google search without changing your tasks">Not now · search ↗</a></div></section><div class="newtab-status" id="newtab-status">Your tasks stay on this computer.</div><p id="feedback" role="status" aria-live="polite"></p></main><script type="module" src="app.js"></script></body></html>
