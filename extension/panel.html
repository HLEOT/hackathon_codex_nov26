<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daytown · tasks and reminders</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="panel.css"></head>
<body class="sidepanel" data-mode="sidepanel"><main class="panel-shell"><header class="panel-header"><a class="brand" href="http://localhost:3000/" target="_blank" rel="noopener" title="Open dashboard"><span class="brand-mark">d<span>✦</span></span>daytown</a><span class="connection" id="connection">Connecting…</span></header>
<section class="panel-next"><div class="card-header"><span class="eyebrow">Next step</span><span class="due-chip" id="due-chip">no deadline</span></div><h1 id="next-title">What needs doing?</h1><p class="tiny-step" id="tiny-step">Hold the mic or type a task below.</p><div class="focus-timer" id="focus-timer" hidden></div><div class="panel-actions"><button class="button dark" id="doing">Start 5 min</button><button class="button pale" id="done">✓ Done</button><button class="button quiet" id="snooze">Later 15 min</button></div></section>
<section class="brain-dump"><button class="mic" id="mic" aria-label="Hold to talk" title="Hold to talk">●</button><form id="command-form"><label for="command">Add or edit a task</label><div class="input-row"><input id="command" maxlength="4000" autocomplete="off" placeholder="Fix auth tests tomorrow at 10"><button id="send" type="submit" aria-label="Save task">↗</button></div></form></section><p id="feedback" role="status" aria-live="polite">Your tasks stay on this computer.</p>
<section class="panel-companion"><div><span class="eyebrow">Pet health</span><h2 id="pet-name">Your pet</h2><p id="pet-caption">Your pet is ready to keep you company.</p><div class="health-track" role="progressbar" aria-label="Pet health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="health-fill"></span></div><div class="health-label"><span id="health-word"></span><span id="health-value">100 / 100</span></div></div><div class="pet-art" id="pet-art"><img id="pet-image" alt="Reminder pet" hidden><div class="pet-placeholder" id="pet-placeholder"><i class="sprout"></i><i class="pet-eye left"></i><i class="pet-eye right"></i><i class="pet-mouth"></i></div></div></section>
<button class="button quiet panel-float" id="float-pet">Pin workbench</button>
<details class="panel-town"><summary>Workbench view <span id="town-count"></span></summary><div class="town-scene wide" id="town-scene"><img id="town-image" alt="Tasks beside a pixel-art workbench" hidden><div class="town-placeholder" id="town-placeholder"><div class="placeholder-hills"></div><div class="placeholder-road"></div><span class="house h1">&gt;_</span><span class="house h2">&gt;_</span></div><div class="town-light" id="town-light"></div><div class="cloud cloud-one"></div><div id="rain" aria-hidden="true"></div><div id="plot-buttons" class="plot-buttons"></div><div id="fireworks" aria-hidden="true"></div></div></details>
<footer class="panel-footer"><label><input type="checkbox" id="voice-enabled"> Voice reminders · AI-generated</label><a href="http://localhost:3000/" target="_blank" rel="noopener">All tasks ↗</a></footer></main><script type="module" src="app.js"></script></body></html>
