<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'"><title>Talk to your companion</title><link rel="stylesheet" href="/companion.css"></head><body><main class="companion-shell"><header><img id="companion-image" alt="Your companion" hidden><div><h1 id="companion-name">Talk to your companion</h1><p id="connection">Daytown is connecting.</p></div><button id="open-app" class="quiet" type="button">Open Daytown</button></header>
<section class="current-task"><label for="task-select">Your tasks</label><div class="task-picker"><select id="task-select" aria-label="Choose a task"></select><button id="select-task" type="button">Work on this</button></div><p id="next-step"></p><p id="work-time" class="time"></p><p id="focus-time" class="time" hidden></p><div class="shortcuts"><button id="ready" type="button">Ready for 5 min</button><button id="gassed" type="button" class="quiet">Take a 5 min break</button><button id="pause" type="button" class="quiet">Pause</button></div></section>
<section class="conversation"><p class="intro">Tell me what you have finished or how you are feeling.</p><div class="capture"><button id="mic" type="button" aria-label="Hold the microphone while you speak" title="Hold the microphone while you speak">●</button><form id="voice-form"><label for="command">Hold to speak, or type here</label><div class="input-row"><input id="command" maxlength="4000" autocomplete="off" placeholder="Auth tests are done"><button id="send" type="submit" aria-label="Review command">↗</button></div></form></div><div class="examples" aria-label="Command examples"><button type="button" data-example="Auth tests are done">Auth tests are done</button><button type="button" data-example="I’m gassed">I’m gassed</button><button type="button" data-example="I’m ready">I’m ready</button></div><p id="status" role="status" aria-live="polite">I will show what I heard before changing a task.</p></section>
<section id="confirmation" class="confirmation" hidden><h2>Check what I heard.</h2><blockquote id="transcript"></blockquote><label id="target-label" for="confirm-task" hidden>Task to change</label><select id="confirm-task" hidden></select><p id="resolved-action"></p><div id="add-preview"></div><div class="confirm-actions"><button id="cancel" type="button" class="quiet">Cancel</button><button id="confirm" type="button">Confirm</button></div></section>
<section class="reply" id="reply" role="status" aria-live="polite" hidden></section><footer><label><input type="checkbox" id="speak-replies" checked> Read replies aloud with an AI voice</label><span id="task-count"></span></footer></main><script type="module" src="/companion.js"></script></body></html>
